<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Aula-16</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Calculadora UVV</h1>
        </header>
        <div>
            <input type="number" id="tela" placeholder="Coloque sua data de nascimento">
            <button onclick="calc()">Calcular</button>
            <input type="number" id="resultado" disabled>
            <p id="respeito"></p>
        </div>
        <hr> 
        <div>
            <p>Data de Nascimento:</p> 
            <input type="number" placeholder="dia">
            <select id="cidade" name="cidade">
                <option selected>Selecione a data</option>
                <option value="janeiro">Janeiro</option>
                <option value="fevereiro">Fevereiro</option>
                <option value="março">Março</option>
                <option value="abril">Abril</option>
                <option value="junho">Junho</option>
                <option value="julho">julho</option>
                <option value="agosto">Agosto</option>
                <option value="setembro">Setembro</option>
                <option value="outubro">Outubro</option>
                <option value="novembro">Novembro</option>
                <option value="dezembro">Dezembro</option>
            </select>
            <input type="number" placeholder="ano">
        </div>
        
        <script src="script.js"></script>
    </body>
</html>
